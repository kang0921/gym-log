<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="重訓紀錄">
  <meta name="theme-color" content="#fff6f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1720" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <title>重訓紀錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" hidden aria-label="返回">‹ 返回</button>
    <h1 id="title">動作</h1>
  </header>

  <main id="view"></main>

  <div class="timer" id="timer" hidden>
    <span>⏱️ 休息</span><strong id="timer-left">1:30</strong>
    <button id="timer-add">+30 秒</button>
    <button id="timer-stop">結束</button>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="lookup" class="on"><span>🔍</span>動作</button>
    <button data-tab="today"><span>📋</span>今天練</button>
    <button data-tab="progress"><span>📈</span>進度</button>
    <button data-tab="log"><span>🗓️</span>紀錄</button>
    <button data-tab="add"><span>➕</span>新增</button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
