<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="重訓紀錄">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#FFFCF6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <title>重訓紀錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" hidden aria-label="返回">‹ 返回</button>
    <h1 id="title">動作</h1>
  </header>

  <main id="view"></main>

  <div class="timer" id="timer" hidden>
    <span>休息中</span><strong id="timer-left">1:30</strong>
    <button id="timer-add">+30 秒</button>
    <button id="timer-stop">結束</button>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="lookup" class="on">
      <svg viewBox="0 0 32 32" fill="none" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle class="fill" cx="14" cy="14" r="8"/><path d="M20 20l7 7"/>
      </svg>動作</button>
    <button data-tab="today">
      <svg viewBox="0 0 32 32" fill="none" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect class="fill" x="7" y="6" width="18" height="22" rx="3"/><path d="M12 4h8v4h-8zM11 14l2 2 4-4M11 22h10"/>
      </svg>今天練</button>
    <button data-tab="progress">
      <svg viewBox="0 0 32 32" fill="none" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect class="fill" x="5" y="17" width="6" height="10" rx="2"/><rect class="fill" x="13" y="11" width="6" height="16" rx="2"/><rect class="fill" x="21" y="5" width="6" height="22" rx="2"/>
      </svg>進度</button>
    <button data-tab="log">
      <svg viewBox="0 0 32 32" fill="none" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect class="fill" x="5" y="7" width="22" height="20" rx="3"/><path d="M5 13h22M11 4v6M21 4v6"/><circle cx="16" cy="20" r="1.5" fill="#3E3A39"/>
      </svg>紀錄</button>
    <button data-tab="add">
      <svg viewBox="0 0 32 32" fill="none" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="fill" d="M21 5l6 6-14 14-7 1 1-7z"/><path d="M18 8l6 6"/>
      </svg>新增</button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/illos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
